<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <rect width="960" height="540" fill="#0a0e17"/>
  
  <!-- Header Bar -->
  <rect x="20" y="20" width="920" height="45" rx="6" fill="#111827" stroke="#2e3b52"/>
  <text x="35" y="48" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff">ARINC716Forge Pro &mdash; Cockpit VHF Transceiver Engineering Studio</text>
  <rect x="750" y="30" width="170" height="25" rx="12" fill="rgba(34,197,94,0.2)" stroke="#22c55e"/>
  <text x="765" y="47" font-family="monospace" font-size="11" font-weight="bold" fill="#4ade80">100% COMPLIANT</text>

  <!-- Left RMP Bezel -->
  <rect x="20" y="80" width="340" height="440" rx="10" fill="#1a2234" stroke="#334155" stroke-width="2"/>
  <text x="35" y="110" font-family="monospace" font-size="12" font-weight="bold" fill="#cbd5e1">RADIO MANAGEMENT PANEL (RMP 1)</text>

  <rect x="35" y="130" width="310" height="75" rx="6" fill="#030712" stroke="#1f2937"/>
  <text x="50" y="152" font-family="monospace" font-size="10" fill="#64748b">ACTIVE (MHz)</text>
  <text x="50" y="188" font-family="monospace" font-size="28" font-weight="bold" fill="#ffb800">118.005</text>

  <circle cx="190" cy="168" r="16" fill="#334155" stroke="#475569"/>
  <text x="183" y="174" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff">&harr;</text>

  <text x="230" y="152" font-family="monospace" font-size="10" fill="#64748b">STANDBY (MHz)</text>
  <text x="230" y="188" font-family="monospace" font-size="28" font-weight="bold" fill="#00ff66">121.500</text>

  <rect x="35" y="220" width="310" height="40" rx="4" fill="#0f172a" stroke="#1e293b"/>
  <text x="50" y="245" font-family="monospace" font-size="12" fill="#38bdf8">SPACING: 8.33 kHz (ICAO EUR 2280-CH)</text>

  <rect x="35" y="275" width="310" height="50" rx="6" fill="#dc2626" stroke="#ef4444"/>
  <text x="90" y="306" font-family="monospace" font-size="14" font-weight="bold" fill="#ffffff">PTT TRANSMIT (25W RF)</text>

  <rect x="35" y="340" width="310" height="160" rx="6" fill="#0b111e" stroke="#1f293d"/>
  <text x="45" y="365" font-family="monospace" font-size="11" font-weight="bold" fill="#94a3b8">STANDBY TUNING KNOBS</text>
  <circle cx="110" cy="420" r="32" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="85" y="426" font-family="monospace" font-size="11" fill="#38bdf8">COARSE</text>
  <circle cx="250" cy="420" r="32" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="235" y="426" font-family="monospace" font-size="11" fill="#38bdf8">FINE</text>

  <!-- Right Dashboards -->
  <rect x="380" y="80" width="560" height="210" rx="8" fill="#111827" stroke="#2e3b52"/>
  <text x="395" y="105" font-family="monospace" font-size="12" font-weight="bold" fill="#cbd5e1">RF SPECTRUM &amp; POWER DYNAMICS (118.000–136.975 MHz)</text>
  <rect x="395" y="120" width="530" height="100" rx="4" fill="#030712" stroke="#1e293b"/>
  <!-- Spectrum line -->
  <path d="M 400 200 L 640 198 L 650 140 L 660 198 L 920 200" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="590" y="135" font-family="monospace" font-size="10" fill="#ef4444">25.0W DSB-AM (Fc=118.000 MHz)</text>

  <rect x="395" y="230" width="120" height="45" rx="4" fill="#0b111e"/>
  <text x="420" y="250" font-family="monospace" font-size="14" font-weight="bold" fill="#ffffff">25.0 W</text>
  <text x="405" y="265" font-family="monospace" font-size="9" fill="#64748b">CARRIER POWER</text>

  <rect x="530" y="230" width="120" height="45" rx="4" fill="#0b111e"/>
  <text x="555" y="250" font-family="monospace" font-size="14" font-weight="bold" fill="#ffffff">1.44:1</text>
  <text x="545" y="265" font-family="monospace" font-size="9" fill="#64748b">ANTENNA VSWR</text>

  <rect x="665" y="230" width="120" height="45" rx="4" fill="#0b111e"/>
  <text x="690" y="250" font-family="monospace" font-size="14" font-weight="bold" fill="#ffffff">24.0 dB</text>
  <text x="680" y="265" font-family="monospace" font-size="9" fill="#64748b">RX SINAD SENS</text>

  <rect x="800" y="230" width="125" height="45" rx="4" fill="#0b111e"/>
  <text x="820" y="250" font-family="monospace" font-size="14" font-weight="bold" fill="#4ade80">-6.0 dB</text>
  <text x="815" y="265" font-family="monospace" font-size="9" fill="#64748b">SIDETONE AUDIO</text>

  <!-- ARINC 429 Bus Telemetry -->
  <rect x="380" y="305" width="560" height="215" rx="8" fill="#111827" stroke="#2e3b52"/>
  <text x="395" y="330" font-family="monospace" font-size="12" font-weight="bold" fill="#cbd5e1">ARINC 429 DIGITAL BUS WORDS (BIT 32 ODD PARITY)</text>
  <text x="395" y="355" font-family="monospace" font-size="11" fill="#4ade80">Label 030 (Freq Tuning) : 0x87180018  [P:1, SSM:11 Normal]</text>
  <text x="395" y="380" font-family="monospace" font-size="11" fill="#4ade80">Label 270 (Discrete Ctrl): 0x60007458  [P:0, PTT:1, 8.33:1]</text>
  <text x="395" y="405" font-family="monospace" font-size="11" fill="#4ade80">Label 350 (BITE Status)  : 0x600000E8  [P:0, SSM:11 No Fault]</text>
  <text x="395" y="430" font-family="monospace" font-size="11" fill="#4ade80">Label 356 (Readback Ack) : 0x871800EE  [P:1, Match Verified]</text>

  <rect x="395" y="455" width="530" height="50" rx="4" fill="#030712" stroke="#1f2937"/>
  <text x="410" y="475" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8">NORMATIVE AIRWORTHINESS AUDIT: 10/10 CRITERIA VERIFIED</text>
  <text x="410" y="492" font-family="monospace" font-size="10" fill="#cbd5e1">Complies with ARINC 716, RTCA DO-186B, ICAO Annex 10 Vol III, and FAA TSO-C37e/C38e.</text>
</svg>