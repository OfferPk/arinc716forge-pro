<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <rect width="960" height="540" fill="#0b0f19"/>
  <defs>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="25" width="900" height="60" rx="8" fill="url(#grad-blue)" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="60" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="20" font-weight="bold" fill="#ffffff">ARINC 716 Airborne VHF Communications Transceiver Architecture</text>
  <text x="730" y="60" font-family="monospace" font-size="12" fill="#38bdf8" font-weight="bold">ARINC716Forge Pro v1.0.0</text>

  <!-- Cockpit Control & Display (RMP / MCDU) -->
  <rect x="30" y="110" width="260" height="380" rx="8" fill="url(#grad-blue)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="45" y="140" font-family="monospace" font-size="14" font-weight="bold" fill="#38bdf8">COCKPIT FLIGHT DECK</text>
  <rect x="45" y="160" width="230" height="70" rx="6" fill="#030712" stroke="#1e293b"/>
  <text x="55" y="185" font-family="monospace" font-size="11" fill="#94a3b8">RADIO MANAGEMENT PANEL</text>
  <text x="55" y="212" font-family="monospace" font-size="20" font-weight="bold" fill="#ffb800">118.005  121.500</text>
  
  <rect x="45" y="245" width="230" height="45" rx="4" fill="#1e293b"/>
  <text x="55" y="272" font-family="monospace" font-size="12" fill="#cbd5e1">8.33 / 25 kHz Channel Select</text>

  <rect x="45" y="305" width="230" height="45" rx="4" fill="#1e293b"/>
  <text x="55" y="332" font-family="monospace" font-size="12" fill="#cbd5e1">PTT Mic &amp; Audio Sidetone</text>

  <rect x="45" y="365" width="230" height="100" rx="6" fill="#030712" stroke="#1e293b"/>
  <text x="55" y="390" font-family="monospace" font-size="11" fill="#64748b">ARINC 429 BUS CONTROL</text>
  <text x="55" y="415" font-family="monospace" font-size="11" fill="#4ade80">Label 030: Freq Tuning (BCD)</text>
  <text x="55" y="435" font-family="monospace" font-size="11" fill="#4ade80">Label 270: Discrete Control</text>
  <text x="55" y="455" font-family="monospace" font-size="11" fill="#4ade80">Label 356: Readback Verify</text>

  <!-- ARINC 716 LRU Transceiver Core -->
  <rect x="330" y="110" width="300" height="380" rx="8" fill="url(#grad-blue)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="345" y="140" font-family="monospace" font-size="14" font-weight="bold" fill="#22c55e">ARINC 716 TRANSCEIVER LRU</text>
  
  <rect x="345" y="160" width="270" height="50" rx="4" fill="#1e293b"/>
  <text x="355" y="185" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">Synthesizer &amp; Channel Filter</text>
  <text x="355" y="200" font-family="monospace" font-size="10" fill="#94a3b8">118.000–136.975 MHz &bull; 8.33/25 kHz Grid</text>

  <rect x="345" y="220" width="270" height="50" rx="4" fill="#1e293b"/>
  <text x="355" y="245" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">25W RF Power Amplifier</text>
  <text x="355" y="260" font-family="monospace" font-size="10" fill="#94a3b8">DSB-AM Modulator &bull; m=85%-95% &bull; +44 dBm</text>

  <rect x="345" y="280" width="270" height="50" rx="4" fill="#1e293b"/>
  <text x="355" y="305" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">Low-Noise Receiver &amp; Squelch</text>
  <text x="355" y="320" font-family="monospace" font-size="10" fill="#94a3b8">-107 dBm (12 dB SINAD) &bull; Audio Gate</text>

  <rect x="345" y="340" width="270" height="50" rx="4" fill="#1e293b"/>
  <text x="355" y="365" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">CLIMAX Offset Generator</text>
  <text x="355" y="380" font-family="monospace" font-size="10" fill="#94a3b8">0 Hz, &plusmn;2.5 kHz, &plusmn;7.5 kHz Multi-Carrier</text>

  <rect x="345" y="400" width="270" height="70" rx="4" fill="#1e293b"/>
  <text x="355" y="425" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">BITE &amp; VSWR Protection</text>
  <text x="355" y="442" font-family="monospace" font-size="10" fill="#f87171">High VSWR Alarm (&gt; 3.0:1) &bull; Over-Temp</text>
  <text x="355" y="458" font-family="monospace" font-size="10" fill="#f87171">Label 350 Fault Serialization</text>

  <!-- RF Section & Aircraft Antenna -->
  <rect x="670" y="110" width="260" height="380" rx="8" fill="url(#grad-blue)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="685" y="140" font-family="monospace" font-size="14" font-weight="bold" fill="#f59e0b">RF ANTENNA &amp; COUPLER</text>

  <rect x="685" y="160" width="230" height="60" rx="4" fill="#1e293b"/>
  <text x="695" y="185" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">50-Ohm Coaxial Feeder</text>
  <text x="695" y="202" font-family="monospace" font-size="10" fill="#94a3b8">Directional Coupler (Pfwd / Prefl)</text>

  <rect x="685" y="235" width="230" height="75" rx="4" fill="#1e293b"/>
  <text x="695" y="260" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">VHF Blade Antenna</text>
  <text x="695" y="278" font-family="monospace" font-size="10" fill="#94a3b8">Top/Bottom Fuselage Mounted</text>
  <text x="695" y="295" font-family="monospace" font-size="10" fill="#94a3b8">Omnidirectional Line-of-Sight</text>

  <rect x="685" y="325" width="230" height="145" rx="6" fill="#030712" stroke="#1e293b"/>
  <text x="695" y="350" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8">AIRWORTHINESS METRICS</text>
  <text x="695" y="375" font-family="monospace" font-size="10" fill="#cbd5e1">&bull; Standard: ARINC 716 Mark 3</text>
  <text x="695" y="395" font-family="monospace" font-size="10" fill="#cbd5e1">&bull; MOPS: RTCA DO-186B</text>
  <text x="695" y="415" font-family="monospace" font-size="10" fill="#cbd5e1">&bull; TSO: FAA TSO-C37e / C38e</text>
  <text x="695" y="435" font-family="monospace" font-size="10" fill="#cbd5e1">&bull; Channels: 2280 (8.33 kHz)</text>
  <text x="695" y="455" font-family="monospace" font-size="10" fill="#4ade80">&bull; Audit Score: 10/10 PASS (100%)</text>
</svg>